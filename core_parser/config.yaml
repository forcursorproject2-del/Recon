classifier:
  mode: "rules_only"          # максимальная стабильность из коробки
  use_rules: true
  use_ml: false               # выключено по умолчанию
  use_bert: false             # выключено по умолчанию

pdf_extractor:
  ocr_enabled: true
  ocr_lang: "ru,en"
  ocr_gpu: false
  ocr_model_dir: "easyocr_models"
  min_text_length_for_ocr_fallback: 300

reconciliation_act:
  keywords:
    - акт сверки
    - взаиморасчётов
    - взаиморасчетов
    - сальдо
    - обороты
    - дебет
    - кредит
    - по состоянию на
    - исходящее сальдо
    - входящее сальдо
    - остаток на начало
    - остаток на конец
  patterns:
    - r'акт\s+сверки'
    - r'взаимн[ыxх]\s+расч[её]т[оа]в?'
    - r'по\s+состоянию\s+на'
    - r'сальдо\s+(?:на\s+начало|на\s+конец|исходящее|входящее)'
    - r'оборот\s+по\s+(?:дебету|кредиту)'
    - r'№\s*[А-ЯЁа-яё0-9\-]+'
    - r'20[0-9]{2}\s*г\.'
  exclude:
    - счет-фактура
    - упд
    - платежное поручение
    - торг-12
  ocr_gpu: false
  ocr_detector: true
  ocr_recognizer: true

# =============================================
# Документные сигнатуры — вечная версия 2025+
# =============================================
document_signatures:
  invoice:
    keywords:
      - счет
      - счёт
      - инвойс
      - счет-фактура
      - счёт-фактура
      - сумма
      - итого
      - налог
      - ндс
    patterns:
      - r'счет[- ]?фактура\s*№?\s*\d+'
      - r'счёт[- ]?фактура\s*№?\s*\d+'
      - r'счет\s*№?\s*\d+'
      - r'счёт\s*№?\s*\d+'
      - r'инвойс\s*№?\s*\d+'
    exclude:
      - платежное
      - поручение
      - платёжное

  payment_order:
    keywords:
      - платежное
      - платёжное
      - поручение
      - платежка
      - получатель
      - бик
      - р/с
      - к/с
    patterns:
      - r'платежное\s+поручение'
      - r'платёжное\s+поручение'
      - r'платежное\s+поручение\s*№?\s*\d+'
    exclude:
      - счет
      - счёт
      - инвойс

  act:
    keywords:
      - акт
      - приемки
      - приёмки
      - выполненных
      - оказания
      - услуг
      - работ
    patterns:
      - r'акт\s+(?:приемки|приёмки)\s+(?:работ|услуг)'
      - r'акт\s+(?:выполненных\s+работ|оказания\s+услуг)'
      - r'акт\s*№?\s*\d+'
    exclude:
      - сверки
      - взаиморасчетов
      - взаиморасчётов
      - увольнение

  invoice_factura:
    keywords:
      - счет-фактура
      - счёт-фактура
      - ндс
      - продавец
      - покупатель
      - исполнитель
      - заказчик
    patterns:
      - r'счет[- ]?фактура\s*№?\s*\d+'
      - r'счёт[- ]?фактура\s*№?\s*\d+'
    exclude:
      - платежное
      - поручение

  dismissal_act:
    keywords:
      - увольнение
      - приказ
      - расторжение
      - прекращение
      - тимлидер
    patterns:
      - r'увольнение'
      - r'приказ\s+об\s+увольнении'
      - r'расторжение\s+трудового\s+договора'
    exclude:
      - счет
      - платежное
      - акт

  reconciliation_act:
    keywords:
      - акт сверки
      - акт взаиморасчетов
      - акт взаиморасчётов
      - взаиморасчеты
      - взаиморасчёты
      - сальдо
      - обороты
      - дебет
      - кредит
      - по состоянию на
      - задолженность
      - исходящее сальдо
      - входящее сальдо
    patterns:
      - r'акт\s+сверки'
      - r'акт\s+сверки\s+взаимн[ыxх]\s+расч[её]т[оа]в?'
      - r'взаимн[ыxх]\s+расч[её]т[оа]в?'
      - r'по\s+состоянию\s+на'
      - r'сальдо\s+(?:на|по)\s+(?:начало|конец|исходящее|входящее)'
      - r'оборот\s+по\s+(?:дебету|кредиту)'
      - r'20[0-9]{2}\s*г\.'
      - r'(?:январ[ья]|феврал[ья]|март[а]|апрел[ья]|ма[йя]|июн[ья]|июл[ья]|август[а]|сентябр[ья]|октябр[ья]|ноябр[ья]|декабр[ья])\s+20[0-9]{2}'
      - r'за\s+период.*20[0-9]{2}'
      - r'с\s+0?1\s*\.?[^\s]*\s+20[0-9]{2}\s+по\s+31\s*\.?'
    exclude:
      - счет
      - счёт
      - платежное
      - поручение
      - увольнение
      - приказ

field_patterns:
  inn:
    pattern: r'ИНН\s*[:\-\/]?[\s]*(\d{12}|\d{10})'
    validate: 'digits_10_12'
  kpp:
    pattern: r'КПП\s*[:\-\/]?[\s]*(\d{9})'
    validate: 'digits_9'
  amount:
    pattern: r'(?:сумма|итого|всего\s+к\s+оплате)[\s:‑\-\/]*([\d\s,\.]+)'
    validate: 'float'
  date:
    pattern: r'(?:дата|от)[\s:‑\-\/]*(\d{1,2}[\.\s]\d{1,2}[\.\s]\d{4}|\d{1,2}\s+[а-яё]+\s+20\d{2})'
    validate: 'date'
  saldo_start:
    pattern: r'(?:сальдо|входящее\s+сальдо|задолженность)\s+(?:на\s+начало|исходящее)[\s:‑\-\/]*([\d\s,\.\-]+)'
    validate: 'float'
  turnover_debit:
    pattern: r'(?:оборот\s+по\s+дебету|дебет)[\s:‑\-\/]*([\d\s,\.\-]+)'
    validate: 'float'
  turnover_credit:
    pattern: r'(?:оборот\s+по\s+кредиту|кредит)[\s:‑\-\/]*([\d\s,\.\-]+)'
    validate: 'float'
  saldo_end:
    pattern: r'(?:сальдо|исходящее\s+сальдо|задолженность)\s+(?:на\s+конец|по\s+состоянию)[\s:‑\-\/]*([\d\s,\.\-]+)'
    validate: 'float'
